name: Movie Anime News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run anime news bot
        run: python news_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}

      - name: Run movie OTT news bot
        run: python movie_news_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MOVIE_CHANNEL: ${{ secrets.MOVIE_CHANNEL }}

      - name: Save bot memory
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json movie_posted.json
          git diff --cached --quiet || git commit -m "Update bot memory"
          git push
